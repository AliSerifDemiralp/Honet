name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          set -e
          mkdir dist
          for t in armv6:arm:6 armv7:arm:7 arm64:arm64: amd64:amd64:; do
            IFS=: read name arch arm <<< "$t"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$arm \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/honet-linux-$name ./cmd/honet
          done
          cp deploy/install.sh deploy/systemd/honet.service dist/
          (cd dist && sha256sum * > sha256sums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/honet" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v6,linux/arm/v7,linux/arm64,linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
