# Run honet in Docker on a Linux host (e.g. a Raspberry Pi):
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   docker logs honet 2>&1 | grep -A2 "SETUP CODE"
# Host networking is required: ARP discovery must see the real LAN.
services:
  honet:
    image: ghcr.io/aliserifdemiralp/honet:latest
    build: ../..
    container_name: honet
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - honet-data:/data
    environment:
      GOMEMLIMIT: 64MiB
    mem_limit: 96m
    restart: unless-stopped

volumes:
  honet-data:
