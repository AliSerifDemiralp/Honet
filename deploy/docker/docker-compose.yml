services:
  honet:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    network_mode: host
    volumes:
      - honet_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: honet-nginx
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  honet_data: