apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: honet
spec:
  selector:
    matchLabels:
      app: honet
  template:
    metadata:
      labels:
        app: honet
    spec:
      hostNetwork: true      # nmap host network visibility
      hostPID: true          # for process lock file
      containers:
      - name: honet
        image: ghcr.io/senin-kullanici-adin/honet:latest
        securityContext:
          capabilities:
            add: ["NET_RAW", "NET_ADMIN"]  # for nmap to work properly
        ports:
        - containerPort: 8501
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        hostPath:
          path: /var/lib/honet