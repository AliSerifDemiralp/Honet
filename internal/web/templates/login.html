{{define "content"}}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <h1 class="h3 text-honet text-center">Honet</h1>
    <p class="text-center text-secondary">Home network visibility</p>
    <div class="card">
      <div class="card-body">
        <form method="post" action="/login">
          <input type="hidden" name="csrf" value="{{.Data.Token}}">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" value="{{.Data.Username}}" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-success w-100" type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{{end}}
